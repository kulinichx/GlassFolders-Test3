name: iOS 16 Optics Lab static checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'GFPrismRim.h'
      - 'GFNativeLiveGlass.h'
      - 'Experiments/GFRefraction*'
      - 'Experiments/GFStandaloneRefractionRenderer.*'
      - 'tests/test_refraction_*'
      - 'tools/render_refraction_demo.py'
      - 'tests/test_folder_native_bridge.py'
      - 'GFAppLibraryGlass.h'
      - 'tests/test_app_library_material.py'
      - 'Tweak.xm'
      - 'prefs/Resources/**'
      - 'tests/test_prism_rim.c'
      - '.github/workflows/optics-lab-tests.yml'
  push:
    branches:
      - 'feat/ios16-optics-lab*'

jobs:
  optics-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run rim regression suite
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            tests/test_prism_rim.c -lm -o /tmp/gf-prism-rim-tests
          /tmp/gf-prism-rim-tests
      - name: Verify genuine texture-coordinate refraction in portable C
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            tests/test_refraction_math.c Experiments/GFRefractionMath.c \
            -lm -o /tmp/gf-refraction-math-tests
          /tmp/gf-refraction-math-tests
      - name: Confirm shader/host remain outside SpringBoard build
        run: python3 tests/test_refraction_isolation.py
      - name: Guard Lab05 device test app isolation
        run: python3 tests/test_optics05_isolation.py
      - name: Validate folder native filter bridge guards
        run: python3 tests/test_folder_native_bridge.py
      - name: Verify retired experiment switches are absent and disabled
        run: python3 tests/test_settings_cleanup.py
      - name: Confirm App Library uses stable closed-folder material
        run: python3 tests/test_app_library_material.py
