name: Build RootHide Test4

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build arm64e RootHide deb
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid xz

      - name: Install RootHide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install patched iOS 16.5 SDK
        run: |
          "$THEOS/bin/install-sdk" 16.5

          echo "Installed SDKs:"
          ls -la "$THEOS/sdks"

          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"
          test -d "$SDK"

          echo "Checking private Preferences framework:"
          find "$SDK/System/Library/PrivateFrameworks/Preferences.framework" -maxdepth 2 -type f -print
          test -d "$SDK/System/Library/PrivateFrameworks/Preferences.framework"

      - name: Show toolchain information
        run: |
          xcodebuild -version
          clang --version
          git -C "$THEOS" rev-parse HEAD
          echo "Project target:"
          grep '^TARGET' Makefile
          echo "Prefs target:"
          grep '^TARGET' prefs/Makefile

      - name: Build RootHide package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Locate generated deb
        id: package
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          test -n "$DEB"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "Generated: $DEB"
          ls -lh "$DEB"

      - name: Extract package
        shell: bash
        run: |
          set -euo pipefail

          DEB="${{ steps.package.outputs.deb }}"
          DEB_ABS="$GITHUB_WORKSPACE/$DEB"

          rm -rf /tmp/gf-test4
          mkdir -p /tmp/gf-test4
          cd /tmp/gf-test4

          ar -x "$DEB_ABS"

          DATA_TAR="$(find . -maxdepth 1 -type f -name 'data.tar.*' | head -n 1)"
          test -n "$DATA_TAR"
          tar -xf "$DATA_TAR"

          echo "Package contents:"
          find . -type f -maxdepth 10 -print

      - name: Verify tweak and preferences are real arm64e
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gf-test4

          TWEAK="$(find . -type f -name 'GlassFolders.dylib' | head -n 1)"
          PREFS="$(find . -type f -path '*GlassFoldersPrefs.bundle/GlassFoldersPrefs' | head -n 1)"

          test -n "$TWEAK"
          test -n "$PREFS"

          echo "Tweak:"
          file "$TWEAK"

          echo "Preferences bundle:"
          file "$PREFS"

          file "$TWEAK" | grep -qi "arm64e"
          file "$PREFS" | grep -qi "arm64e"

          echo "Both arm64e checks passed."

      - name: Verify SpringBoard-only injection filter
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gf-test4

          FILTER="$(find . -type f -path '*MobileSubstrate/DynamicLibraries/GlassFolders.plist' | head -n 1)"
          test -n "$FILTER"

          cat "$FILTER"
          grep -q "com.apple.springboard" "$FILTER"

      - name: SHA256
        run: |
          shasum -a 256 "${{ steps.package.outputs.deb }}"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassFolders-Test4-DEB
          path: ${{ steps.package.outputs.deb }}
          if-no-files-found: error
          retention-days: 14
