name: Build RootHide Test4

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build arm64e RootHide deb
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid xz

      - name: Install RootHide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Show toolchain information
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version
          git -C "$THEOS" rev-parse HEAD

      - name: Build RootHide package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Locate generated deb
        id: package
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          test -n "$DEB"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          ls -lh "$DEB"

      - name: Extract and verify both Mach-O binaries are arm64e
        shell: bash
        run: |
          set -euo pipefail

          DEB="${{ steps.package.outputs.deb }}"
          DEB_ABS="$GITHUB_WORKSPACE/$DEB"

          rm -rf /tmp/gf-test4
          mkdir -p /tmp/gf-test4
          cd /tmp/gf-test4

          ar -x "$DEB_ABS"
          DATA_TAR="$(find . -maxdepth 1 -type f -name 'data.tar.*' | head -n 1)"
          test -n "$DATA_TAR"
          tar -xf "$DATA_TAR"

          TWEAK="$(find . -type f -name 'GlassFolders.dylib' | head -n 1)"
          PREFS="$(find . -type f -path '*GlassFoldersPrefs.bundle/GlassFoldersPrefs' | head -n 1)"

          test -n "$TWEAK"
          test -n "$PREFS"

          echo "Tweak binary:"
          file "$TWEAK"

          echo "Preferences binary:"
          file "$PREFS"

          if ! file "$TWEAK" | grep -qi "arm64e"; then
            echo "ERROR: GlassFolders.dylib is not arm64e"
            exit 1
          fi

          if ! file "$PREFS" | grep -qi "arm64e"; then
            echo "ERROR: GlassFoldersPrefs is not arm64e"
            exit 1
          fi

          echo "Both arm64e checks passed."

      - name: Verify injection filter
        shell: bash
        run: |
          set -euo pipefail

          DEB="${{ steps.package.outputs.deb }}"
          DEB_ABS="$GITHUB_WORKSPACE/$DEB"

          rm -rf /tmp/gf-test4-filter
          mkdir -p /tmp/gf-test4-filter
          cd /tmp/gf-test4-filter

          ar -x "$DEB_ABS"
          DATA_TAR="$(find . -maxdepth 1 -type f -name 'data.tar.*' | head -n 1)"
          tar -xf "$DATA_TAR"

          FILTER="$(find . -type f -path '*MobileSubstrate/DynamicLibraries/GlassFolders.plist' | head -n 1)"
          test -n "$FILTER"

          cat "$FILTER"
          grep -q "com.apple.springboard" "$FILTER"

      - name: SHA256
        run: |
          shasum -a 256 "${{ steps.package.outputs.deb }}"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassFolders-Test4-DEB
          path: ${{ steps.package.outputs.deb }}
          if-no-files-found: error
          retention-days: 14
