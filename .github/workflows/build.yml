name: GlassFolders 0.7.4 Beta2.5 SPLIT-STRENGTH-CONTROLS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: RootHide arm64e folder-only
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Workflow stamp
        run: |
          echo "=== GLASSFOLDERS 0.7.4 BETA2.5 SPLIT-STRENGTH-CONTROLS ==="
          echo "THEOS=$THEOS"

      - name: Set up Python for PNG verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install ldid xz

          echo "Python selected by actions/setup-python:"
          which python
          python --version

          echo "Installing Pillow into setup-python environment..."
          python -m pip install --upgrade pip
          python -m pip install pillow

          echo "Verifying Pillow import..."
          python - <<'PY'
          from PIL import Image
          print("Pillow import OK")
          print("PIL image module:", Image)
          PY

      - name: Install RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$THEOS"
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          test -f "$THEOS/makefiles/common.mk"

      - name: Install and normalize patched iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$THEOS/sdks"
          SDK_EXACT="$SDK_ROOT/iPhoneOS16.5.sdk"
          SDK_ARCHIVE="/tmp/iPhoneOS16.5.sdk.tar.xz"
          SDK_URL="https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz"

          mkdir -p "$SDK_ROOT"
          rm -rf "$SDK_EXACT" "$SDK_ARCHIVE"

          curl -fL --retry 3 --retry-delay 2 \
            "$SDK_URL" \
            -o "$SDK_ARCHIVE"

          tar -xJf "$SDK_ARCHIVE" -C "$SDK_ROOT"

          FOUND="$(find "$SDK_ROOT" -maxdepth 3 -type d -name 'iPhoneOS16.5.sdk' -print -quit)"
          test -n "$FOUND"

          if [ "$FOUND" != "$SDK_EXACT" ]; then
            rm -rf "$SDK_EXACT"
            ditto "$FOUND" "$SDK_EXACT"
          fi

          test -d "$SDK_EXACT"
          test -d "$SDK_EXACT/System/Library/PrivateFrameworks/Preferences.framework"

          echo "SDK verified at $SDK_EXACT"

      - name: Normalize old repository leftovers
        shell: bash
        run: |
          set -euo pipefail

          echo "Deleting all obsolete PreferenceLoader entry/icon files..."
          rm -f \
            layout/Library/PreferenceLoader/Preferences/GlassFolders.plist \
            layout/Library/PreferenceLoader/Preferences/GlassFoldersIcon.png \
            layout/Library/PreferenceLoader/Preferences/GlassFoldersIcon@2x.png \
            layout/Library/PreferenceLoader/Preferences/GlassFoldersIcon@3x.png \
            layout/Library/PreferenceLoader/Preferences/GlassFolders/GlassFoldersIcon.png \
            layout/Library/PreferenceLoader/Preferences/GlassFolders/GlassFoldersIcon@2x.png \
            layout/Library/PreferenceLoader/Preferences/GlassFolders/GlassFoldersIcon@3x.png

          echo "Only this PreferenceLoader plist may remain:"
          find layout/Library/PreferenceLoader/Preferences -type f -name '*.plist' -print

          test -f layout/Library/PreferenceLoader/Preferences/GlassFolders/GlassFolders.plist
          test ! -e layout/Library/PreferenceLoader/Preferences/GlassFolders.plist

      - name: Source sanity gate
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'GLASSFOLDERS 0.7.4 BETA2.5 SPLIT-STRENGTH-CONTROLS' \
            .github/workflows/build.yml

          # Beta2.5 separates the two style controls while retaining a read-only
          # legacy GlassStrength migration path for existing installations.
          grep -Fq 'CFSTR("ClearStrength")' Tweak.xm
          grep -Fq 'CFSTR("LiquidGlassStrength")' Tweak.xm
          grep -Fq 'CFSTR("GlassStrength")' Tweak.xm
          python - <<'PY'
          import plistlib
          with open('prefs/Resources/Root.plist', 'rb') as f:
              root = plistlib.load(f)
          sliders = [x for x in root['items'] if x.get('cell') == 'PSSliderCell']
          keys = [x.get('key') for x in sliders]
          assert keys == ['ClearStrength', 'LiquidGlassStrength'], keys
          assert all(x.get('default') == 55 for x in sliders)
          assert not any(x.get('key') == 'GlassStrength' for x in root['items'])
          print('Independent Clear/Liquid strength sliders verified:', keys)
          PY

          grep -Fq '%group GFIconHooks' Tweak.xm
          grep -Fq '%init(GFIconHooks);' Tweak.xm
          grep -Fq 'SBFolderIconImageView' Tweak.xm

          grep -Fq '%group GFOpenedPanelHooks' Tweak.xm
          grep -Fq '%init(GFOpenedPanelHooks);' Tweak.xm
          grep -Fq '%hook SBFolderBackgroundView' Tweak.xm

          # Beta2.5 may resolve the exact App Library category background class
          # dynamically as a passive view, but must not hook App Library controllers,
          # actively trigger its visual-style method, or link SpringBoardHome.
          grep -Fq 'SBHLibraryCategoryPodBackgroundView' Tweak.xm
          grep -Fq 'GFCreateNativeAppLibraryPodVisual' Tweak.xm

          # Regression guard: this one-shot activation was the source of the
          # darker closed-folder material that Beta2.5 intentionally keeps removed.
          if grep -Eq 'GFActivateNativeAppLibraryPodVisual|_updateVisualStyle' Tweak.xm; then
            echo "ERROR: active App Library pod visual-style path reintroduced."
            exit 1
          fi

          # Exact closed Liquid Glass regression guard. These are the values
          # from the earlier on-device reference that the user accepted.
          grep -Fq 'brightness = 0.006 + (0.014 * materialResponse);' Tweak.xm
          grep -Fq '? 0.030 + (0.060 * tintResponse)' Tweak.xm
          grep -Fq 'podView.alpha = MIN(0.78, 0.42 + 0.36 * materialResponse);' Tweak.xm

          # Clear must remain a real wallpaper-owned shallow backdrop sample.
          grep -Fq 'Clear reference target: a THIN wallpaper-owned material.' Tweak.xm
          grep -Fq 'self.gfBackdropSampleView.hidden = NO;' Tweak.xm

          # Beta2.5 slider contract: ClearStrength primarily changes
          # local blur. Neutral optics settle early instead of growing across
          # the full slider range.
          grep -Fq 'GFClearBlurResponse' Tweak.xm
          grep -Fq 'GFClearActivationResponse' Tweak.xm
          grep -Fq 'GFClearOpenedBlurResponse' Tweak.xm
          grep -Fq 'blurRadius = 8.0 * clearBlurResponse;' Tweak.xm
          grep -Fq '? (0.36 * clearActivation)' Tweak.xm
          grep -Fq 'self.gfOpticalLayer.opacity = clearActivation *' Tweak.xm
          grep -Fq 'blurRadius = 8.40 * clearBlurResponse;' Tweak.xm
          grep -Fq 'saturation = 1.120 + (0.055 * clearActivation);' Tweak.xm
          grep -Fq ': 0.010 * clearActivation;' Tweak.xm

          if grep -Fq '0.55 + 1.70 * materialResponse' Tweak.xm || \
             grep -Fq '0.45 + 1.50 * materialResponse' Tweak.xm || \
             grep -Fq '1.8 + (6.0 * materialResponse)' Tweak.xm; then
            echo "ERROR: old Clear blur curve reintroduced."
            exit 1
          fi

          if grep -Eq '%hook[[:space:]]+SBHLibrary|AppLibraryPods|GFShouldUseAppLibraryPods|SpringBoardHome\.framework|MSHookMessageEx|SBFloatyFolderView|_newPageBackgroundView|setBackgroundAlpha:|SBFolderControllerBackgroundView' Tweak.xm; then
            echo "ERROR: unsafe/obsolete experimental App Library code remains."
            exit 1
          fi

          python - <<'PY'
          import plistlib
          from PIL import Image

          plist = "layout/Library/PreferenceLoader/Preferences/GlassFolders/GlassFolders.plist"
          with open(plist, "rb") as f:
              p = plistlib.load(f)

          assert p["entry"]["bundle"] == "GlassFoldersPrefs"
          assert p["entry"]["icon"] == "GlassFolders.png"

          for path in (
              "layout/Library/PreferenceLoader/Preferences/GlassFolders/GlassFolders.png",
              "layout/Library/PreferenceLoader/Preferences/GlassFolders/GlassFolders@2x.png",
              "layout/Library/PreferenceLoader/Preferences/GlassFolders/GlassFolders@3x.png",
          ):
              im = Image.open(path).convert("RGBA")
              # Transparent external corners are intentional.
              assert im.getpixel((0, 0))[3] < 16
              assert im.getpixel((im.width - 1, 0))[3] < 16
              assert im.getpixel((0, im.height - 1))[3] < 16
              assert im.getpixel((im.width - 1, im.height - 1))[3] < 16

          print("Rounded-alpha source icons verified.")
          PY

          echo "Checking Beta2.5 locked Liquid baselines + independent Clear/Liquid controls..."
          # These names are unique to GFCreateOpenedPanelLightingImage in the
          # Beta2.5 locked continuous-tangent model, so the gate cannot accidentally
          # pass by finding similarly named closed-folder lighting variables.
          grep -Fq 'Beta 2.5 — locked symmetric continuous tangent rails.' Tweak.xm
          grep -Fq 'primaryQuadrantEnergy' Tweak.xm
          grep -Fq 'secondaryQuadrantEnergy' Tweak.xm
          grep -Fq 'tangentOverlap' Tweak.xm
          grep -Fq 'sideTailLength' Tweak.xm
          grep -Fq 'topLeftFadeStart' Tweak.xm
          grep -Fq 'bottomRightFadeStart' Tweak.xm
          grep -Fq 'primaryEnvelope' Tweak.xm
          grep -Fq 'secondaryEnvelope' Tweak.xm
          grep -Fq 'topLeftTailSmooth' Tweak.xm
          grep -Fq 'bottomRightTailSmooth' Tweak.xm
          grep -Fq 'primaryTurnGain' Tweak.xm
          grep -Fq 'secondaryTurnGain' Tweak.xm
          grep -Fq 'endpointRadius * 1.12' Tweak.xm
          grep -Fq '@"P23-%@-%@-%zux%zu-r%.2f-s%ld"' Tweak.xm

          if grep -Eq 'topLeftArcOwnership|bottomRightArcOwnership|topStraightOwnership|bottomStraightOwnership' Tweak.xm; then
            echo "ERROR: old piecewise opened-rail splice model remains."
            exit 1
          fi

          if grep -Eq 'leftCornerBridge|rightCornerBridge|sideRailGain|darkAxisWeight|pairedCorner' Tweak.xm; then
            echo "ERROR: obsolete Beta1.5/older edge-distribution model remains."
            exit 1
          fi

          echo "Checking Beta1.6.1 obsolete-variable cleanup..."
          if grep -Eq 'CGFloat[[:space:]]+(highlightShoulderGain|highlightCoreGain|highlightFilamentGain|shoulderGain|coreGain|filamentGain|horizontalEdge)[[:space:]]*=' Tweak.xm; then
            echo "ERROR: obsolete Beta1.6 unused-variable declaration remains."
            grep -En 'CGFloat[[:space:]]+(highlightShoulderGain|highlightCoreGain|highlightFilamentGain|shoulderGain|coreGain|filamentGain|horizontalEdge)[[:space:]]*=' Tweak.xm || true
            exit 1
          fi

          echo "Checking About / Author credit..."
          python - <<'PY'
          import plistlib

          with open("prefs/Resources/Root.plist", "rb") as f:
              p = plistlib.load(f)

          items = p["items"]
          about = [x for x in items if x.get("cell") == "PSGroupCell" and x.get("label") == "关于"]
          author = [
              x for x in items
              if x.get("cell") == "PSTitleValueCell"
              and x.get("label") == "作者"
              and x.get("get") == "authorValue:"
          ]

          if len(about) != 1:
              raise SystemExit(f"Expected exactly one 关于 group, got {len(about)}")
          if len(author) != 1:
              raise SystemExit(f"Expected exactly one 作者 PSTitleValueCell, got {len(author)}")

          print("Author specifier OK: 作者 -> authorValue:")
          PY

          grep -Fq 'return @"kulinich";' prefs/GFRootListController.m

          echo "Source sanity gate passed."

      - name: Build RootHide package
        shell: bash
        run: |
          set -euo pipefail

          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"
          test -d "$SDK"

          echo "PWD=$(pwd)"
          echo "THEOS=$THEOS"
          ls -ld "$THEOS" "$SDK"

          make THEOS="$THEOS" clean
          make THEOS="$THEOS" package FINALPACKAGE=1

      - name: Locate deb
        id: package
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | sort | tail -n 1)"
          test -n "$DEB"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          ls -lh "$DEB"

      - name: Verify actual final deb
        shell: bash
        run: |
          set -euo pipefail

          DEB="${{ steps.package.outputs.deb }}"
          TMP="/tmp/gf074b25"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          cd "$TMP"

          ar -x "$GITHUB_WORKSPACE/$DEB"
          DATA="$(find . -maxdepth 1 -type f -name 'data.tar*' | head -n 1)"
          CONTROL="$(find . -maxdepth 1 -type f -name 'control.tar*' | head -n 1)"
          test -n "$DATA"
          test -n "$CONTROL"

          mkdir root ctrl
          tar -xf "$DATA" -C root
          tar -xf "$CONTROL" -C ctrl

          DYLIB="$(find root -type f -name 'GlassFolders.dylib' | head -n 1)"
          PREFBIN="$(find root -type f -path '*GlassFoldersPrefs.bundle/GlassFoldersPrefs' | head -n 1)"
          FILTER="$(find root -type f -path '*MobileSubstrate/DynamicLibraries/GlassFolders.plist' | head -n 1)"

          test -n "$DYLIB"
          test -n "$PREFBIN"
          test -n "$FILTER"

          file "$DYLIB" | grep -qi 'arm64e'
          file "$PREFBIN" | grep -qi 'arm64e'

          grep -q 'com.apple.springboard' "$FILTER"
          if grep -qi 'launchd' "$FILTER"; then
            echo "ERROR: launchd injection detected"
            exit 1
          fi

          strings "$DYLIB" > tweak.strings
          grep -Fq 'SBFolderIconImageView' tweak.strings
          grep -Fq 'SBFolderBackgroundView' tweak.strings

          # Exact native category-pod class is expected as a passive view in Beta2.5.
          # Other App Library/controller experiments and direct framework references are not.
          grep -Fq 'SBHLibraryCategoryPodBackgroundView' tweak.strings

          if grep -Eq 'AppLibraryPods|GFShouldUseAppLibraryPods|SpringBoardHome\.framework|SBFloatyFolderView|_newPageBackgroundView|setBackgroundAlpha:|SBFolderControllerBackgroundView' tweak.strings; then
            echo "ERROR: unsafe/obsolete symbol leaked into final dylib"
            exit 1
          fi

          PREFROOT="$(find root -type d -path '*/Library/PreferenceLoader/Preferences' | head -n 1)"
          test -n "$PREFROOT"

          echo "Packaged PreferenceLoader files:"
          find "$PREFROOT" -type f -print | sort

          # Hard reject the exact duplicate entry seen in Beta1.2.
          if [ -f "$PREFROOT/GlassFolders.plist" ]; then
            echo "ERROR: duplicate legacy top-level GlassFolders.plist is packaged."
            exit 1
          fi

          PL="$PREFROOT/GlassFolders"
          test -f "$PL/GlassFolders.plist"
          test -f "$PL/GlassFolders.png"
          test -f "$PL/GlassFolders@2x.png"
          test -f "$PL/GlassFolders@3x.png"

          if find "$PREFROOT" -type f -name 'GlassFoldersIcon*.png' | grep -q .; then
            echo "ERROR: obsolete GlassFoldersIcon*.png remains."
            find "$PREFROOT" -type f -name 'GlassFoldersIcon*.png' -print
            exit 1
          fi

          PLIST_COUNT="$(find "$PREFROOT" -type f -name 'GlassFolders.plist' | wc -l | tr -d ' ')"
          if [ "$PLIST_COUNT" != "1" ]; then
            echo "ERROR: expected exactly one GlassFolders.plist, got $PLIST_COUNT"
            exit 1
          fi

          PB="$(find root -type d -path '*/Library/PreferenceBundles/GlassFoldersPrefs.bundle' | head -n 1)"
          test -n "$PB"
          test -f "$PB/GlassFolders.png"
          test -f "$PB/GlassFolders@2x.png"
          test -f "$PB/GlassFolders@3x.png"
          test -f "$PB/GlassFoldersLarge.png"

          python - "$PL/GlassFolders.plist" \
            "$PL/GlassFolders.png" \
            "$PL/GlassFolders@2x.png" \
            "$PL/GlassFolders@3x.png" \
            "$PB/Info.plist" <<'PY'
          import plistlib, sys
          from PIL import Image

          with open(sys.argv[1], "rb") as f:
              entry = plistlib.load(f)
          assert entry["entry"]["icon"] == "GlassFolders.png"

          expected_sizes = [(29, 29), (58, 58), (87, 87)]
          for path, size in zip(sys.argv[2:5], expected_sizes):
              im = Image.open(path).convert("RGBA")
              assert im.size == size
              corners = [
                  im.getpixel((0, 0))[3],
                  im.getpixel((im.width - 1, 0))[3],
                  im.getpixel((0, im.height - 1))[3],
                  im.getpixel((im.width - 1, im.height - 1))[3],
              ]
              assert max(corners) < 16, (path, corners)

          with open(sys.argv[5], "rb") as f:
              info = plistlib.load(f)
          assert info["CFBundleIconFile"] == "GlassFolders"

          print("Exactly one Settings entry + rounded-alpha icons verified.")
          PY

          if find ctrl -maxdepth 1 -type f \( -name preinst -o -name postinst -o -name prerm -o -name postrm \) | grep -q .; then
            echo "ERROR: unexpected maintainer script present"
            exit 1
          fi

          echo "Verifying packaged About / Author credit..."
          ROOT_PLIST="$(find root -type f -path '*GlassFoldersPrefs.bundle/Root.plist' | head -n 1)"
          test -n "$ROOT_PLIST"

          python - "$ROOT_PLIST" <<'PY'
          import plistlib, sys

          with open(sys.argv[1], "rb") as f:
              p = plistlib.load(f)

          items = p["items"]
          author = [
              x for x in items
              if x.get("cell") == "PSTitleValueCell"
              and x.get("label") == "作者"
              and x.get("get") == "authorValue:"
          ]
          if len(author) != 1:
              raise SystemExit("Packaged author row missing or duplicated")

          print("Packaged author row verified.")
          PY

          strings "$PREFBIN" | grep -Fq 'kulinich'

          echo "FINAL DEB VERIFICATION PASSED"

      - name: SHA256
        run: |
          shasum -a 256 "${{ steps.package.outputs.deb }}"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: GlassFolders-0.7.4-Beta2.5-DEB
          path: ${{ steps.package.outputs.deb }}
          if-no-files-found: error
          retention-days: 14
