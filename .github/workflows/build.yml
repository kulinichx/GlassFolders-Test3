name: GlassFolders 1.0.0 Commercial

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-roothide:
    name: RootHide arm64e
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos-roothide

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Workflow stamp
        run: |
          echo "=== GLASSFOLDERS 1.0.0 / ROOTHIDE ARM64E ==="

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid xz

      - name: Install RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$THEOS"
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          test -f "$THEOS/makefiles/common.mk"

      - name: Install iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$THEOS/sdks"
          SDK_EXACT="$SDK_ROOT/iPhoneOS16.5.sdk"
          SDK_ARCHIVE="/tmp/iPhoneOS16.5.sdk.tar.xz"
          mkdir -p "$SDK_ROOT"
          rm -rf "$SDK_EXACT" "$SDK_ARCHIVE"

          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz" \
            -o "$SDK_ARCHIVE"
          tar -xJf "$SDK_ARCHIVE" -C "$SDK_ROOT"

          FOUND="$(find "$SDK_ROOT" -maxdepth 3 -type d -name 'iPhoneOS16.5.sdk' -print -quit)"
          test -n "$FOUND"
          if [ "$FOUND" != "$SDK_EXACT" ]; then
            rm -rf "$SDK_EXACT"
            ditto "$FOUND" "$SDK_EXACT"
          fi
          test -d "$SDK_EXACT"

      - name: Normalize obsolete PreferenceLoader leftovers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            layout/Library/PreferenceLoader/Preferences/GlassFolders.plist \
            layout/Library/PreferenceLoader/Preferences/GlassFoldersIcon.png \
            layout/Library/PreferenceLoader/Preferences/GlassFoldersIcon@2x.png \
            layout/Library/PreferenceLoader/Preferences/GlassFoldersIcon@3x.png \
            layout/Library/PreferenceLoader/Preferences/GlassFolders/GlassFoldersIcon.png \
            layout/Library/PreferenceLoader/Preferences/GlassFolders/GlassFoldersIcon@2x.png \
            layout/Library/PreferenceLoader/Preferences/GlassFolders/GlassFoldersIcon@3x.png

      - name: Build RootHide package
        shell: bash
        run: |
          set -euo pipefail
          # RootHide commercial build keeps arm64e architecture.
          sed -i '' 's/^Architecture:.*/Architecture: iphoneos-arm64e/' control
          make THEOS="$THEOS" clean
          make THEOS="$THEOS" package FINALPACKAGE=1 ARCHS=arm64e

      - name: Locate package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | sort | tail -n 1)"
          test -n "$DEB"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          ls -lh "$DEB"

      - name: Verify RootHide package
        shell: bash
        run: |
          set -euo pipefail
          DEB="${{ steps.package.outputs.deb }}"
          TMP="/tmp/gf100-roothide"
          rm -rf "$TMP"
          mkdir -p "$TMP/root" "$TMP/ctrl"
          cd "$TMP"

          ar -x "$GITHUB_WORKSPACE/$DEB"
          DATA="$(find . -maxdepth 1 -type f -name 'data.tar*' | head -n 1)"
          CONTROL="$(find . -maxdepth 1 -type f -name 'control.tar*' | head -n 1)"
          test -n "$DATA" -a -n "$CONTROL"
          tar -xf "$DATA" -C root
          tar -xf "$CONTROL" -C ctrl

          grep -q '^Package: com.kulinich.glassfolders$' ctrl/control
          grep -q '^Version: 1.0.0$' ctrl/control
          grep -q '^Architecture: iphoneos-arm64e$' ctrl/control

          DYLIB="$(find root -type f -name 'GlassFolders.dylib' | head -n 1)"
          PREFBIN="$(find root -type f -path '*GlassFoldersPrefs.bundle/GlassFoldersPrefs' | head -n 1)"
          FILTER="$(find root -type f -path '*MobileSubstrate/DynamicLibraries/GlassFolders.plist' | head -n 1)"
          ROOT_PLIST="$(find root -type f -path '*GlassFoldersPrefs.bundle/Root.plist' | head -n 1)"
          EN_STRINGS="$(find root -type f -path '*GlassFoldersPrefs.bundle/en.lproj/Root.strings' | head -n 1)"
          ZH_STRINGS="$(find root -type f -path '*GlassFoldersPrefs.bundle/zh-Hans.lproj/Root.strings' | head -n 1)"

          test -n "$DYLIB" -a -n "$PREFBIN" -a -n "$FILTER" -a -n "$ROOT_PLIST"
          test -n "$EN_STRINGS" -a -n "$ZH_STRINGS"

          file "$DYLIB" | grep -qi 'arm64e'
          file "$PREFBIN" | grep -qi 'arm64e'
          grep -q 'com.apple.springboard' "$FILTER"

          python3 - "$ROOT_PLIST" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              p = plistlib.load(f)
          items = p["items"]
          defaults = {x.get("key"): x.get("defaults") for x in items if x.get("key")}
          assert set(defaults.values()) == {"com.kulinich.glassfolders"}
          assert any(x.get("label") == "Folders" for x in items)
          assert any(x.get("label") == "App Library" for x in items)
          print("RootHide product identity/localization resources verified.")
          PY

      - name: SHA256
        run: shasum -a 256 "${{ steps.package.outputs.deb }}"

      - name: Upload RootHide deb
        uses: actions/upload-artifact@v4
        with:
          name: GlassFolders-1.0.0-RootHide-arm64e
          path: ${{ steps.package.outputs.deb }}
          if-no-files-found: error
          retention-days: 14

  build-rootless:
    name: Standard rootless arm64
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Workflow stamp
        run: |
          echo "=== GLASSFOLDERS 1.0.0 / STANDARD ROOTLESS ARM64 ==="

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid xz

      - name: Install official Theos
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          test -f "$THEOS/makefiles/common.mk"

      - name: Install iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$THEOS/sdks"
          SDK_EXACT="$SDK_ROOT/iPhoneOS16.5.sdk"
          SDK_ARCHIVE="/tmp/iPhoneOS16.5.sdk.tar.xz"
          mkdir -p "$SDK_ROOT"
          rm -rf "$SDK_EXACT" "$SDK_ARCHIVE"

          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz" \
            -o "$SDK_ARCHIVE"
          tar -xJf "$SDK_ARCHIVE" -C "$SDK_ROOT"

          FOUND="$(find "$SDK_ROOT" -maxdepth 3 -type d -name 'iPhoneOS16.5.sdk' -print -quit)"
          test -n "$FOUND"
          if [ "$FOUND" != "$SDK_EXACT" ]; then
            rm -rf "$SDK_EXACT"
            ditto "$FOUND" "$SDK_EXACT"
          fi
          test -d "$SDK_EXACT"

      - name: Normalize obsolete PreferenceLoader leftovers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            layout/Library/PreferenceLoader/Preferences/GlassFolders.plist \
            layout/Library/PreferenceLoader/Preferences/GlassFoldersIcon.png \
            layout/Library/PreferenceLoader/Preferences/GlassFoldersIcon@2x.png \
            layout/Library/PreferenceLoader/Preferences/GlassFoldersIcon@3x.png \
            layout/Library/PreferenceLoader/Preferences/GlassFolders/GlassFoldersIcon.png \
            layout/Library/PreferenceLoader/Preferences/GlassFolders/GlassFoldersIcon@2x.png \
            layout/Library/PreferenceLoader/Preferences/GlassFolders/GlassFoldersIcon@3x.png

      - name: Build standard rootless package
        shell: bash
        run: |
          set -euo pipefail
          # Each job has a clean checkout, so changing Architecture here is safe.
          sed -i '' 's/^Architecture:.*/Architecture: iphoneos-arm64/' control
          make THEOS="$THEOS" clean
          make THEOS="$THEOS" package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            ARCHS=arm64

      - name: Locate package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | sort | tail -n 1)"
          test -n "$DEB"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          ls -lh "$DEB"

      - name: Verify standard rootless package
        shell: bash
        run: |
          set -euo pipefail
          DEB="${{ steps.package.outputs.deb }}"
          TMP="/tmp/gf100-rootless"
          rm -rf "$TMP"
          mkdir -p "$TMP/root" "$TMP/ctrl"
          cd "$TMP"

          ar -x "$GITHUB_WORKSPACE/$DEB"
          DATA="$(find . -maxdepth 1 -type f -name 'data.tar*' | head -n 1)"
          CONTROL="$(find . -maxdepth 1 -type f -name 'control.tar*' | head -n 1)"
          test -n "$DATA" -a -n "$CONTROL"
          tar -xf "$DATA" -C root
          tar -xf "$CONTROL" -C ctrl

          grep -q '^Package: com.kulinich.glassfolders$' ctrl/control
          grep -q '^Version: 1.0.0$' ctrl/control
          grep -q '^Architecture: iphoneos-arm64$' ctrl/control

          DYLIB="$(find root -type f -name 'GlassFolders.dylib' | head -n 1)"
          PREFBIN="$(find root -type f -path '*GlassFoldersPrefs.bundle/GlassFoldersPrefs' | head -n 1)"
          FILTER="$(find root -type f -path '*MobileSubstrate/DynamicLibraries/GlassFolders.plist' | head -n 1)"
          ROOT_PLIST="$(find root -type f -path '*GlassFoldersPrefs.bundle/Root.plist' | head -n 1)"
          EN_STRINGS="$(find root -type f -path '*GlassFoldersPrefs.bundle/en.lproj/Root.strings' | head -n 1)"
          ZH_STRINGS="$(find root -type f -path '*GlassFoldersPrefs.bundle/zh-Hans.lproj/Root.strings' | head -n 1)"

          test -n "$DYLIB" -a -n "$PREFBIN" -a -n "$FILTER" -a -n "$ROOT_PLIST"
          test -n "$EN_STRINGS" -a -n "$ZH_STRINGS"

          file "$DYLIB" | grep -qi 'arm64'
          file "$PREFBIN" | grep -qi 'arm64'
          grep -q 'com.apple.springboard' "$FILTER"

          # Standard rootless package data should be rooted under /var/jb.
          if ! find root -type f | grep -q '/var/jb/'; then
            echo "ERROR: package does not look like a standard rootless package."
            exit 1
          fi

          python3 - "$ROOT_PLIST" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              p = plistlib.load(f)
          defaults = {
              x.get("key"): x.get("defaults")
              for x in p["items"]
              if x.get("key")
          }
          assert set(defaults.values()) == {"com.kulinich.glassfolders"}
          print("Standard rootless product identity/localization resources verified.")
          PY

      - name: SHA256
        run: shasum -a 256 "${{ steps.package.outputs.deb }}"

      - name: Upload rootless deb
        uses: actions/upload-artifact@v4
        with:
          name: GlassFolders-1.0.0-Rootless-arm64
          path: ${{ steps.package.outputs.deb }}
          if-no-files-found: error
          retention-days: 14
