name: Build RootHide 0.7 Beta4

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build arm64e RootHide deb
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid xz

      - name: Install RootHide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install official Theos patched iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$THEOS/sdks"

          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          SDK_ARCHIVE="/tmp/iPhoneOS16.5.sdk.tar.xz"

          curl -L --fail --retry 3 --retry-delay 2 \
            "$SDK_URL" \
            -o "$SDK_ARCHIVE"

          tar -xJf "$SDK_ARCHIVE" -C "$THEOS/sdks"

          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"
          test -d "$SDK"

          PREF_FRAMEWORK="$SDK/System/Library/PrivateFrameworks/Preferences.framework"
          test -d "$PREF_FRAMEWORK"

          if ! find "$PREF_FRAMEWORK" -type f \( -name '*.tbd' -o -name 'Preferences' \) | grep -q .; then
            echo "ERROR: Preferences framework link stub was not found."
            exit 1
          fi

      - name: Build RootHide package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Locate generated deb
        id: package
        shell: bash
        run: |
          set -euo pipefail

          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          test -n "$DEB"

          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          ls -lh "$DEB"

      - name: Extract and verify package
        shell: bash
        run: |
          set -euo pipefail

          DEB="${{ steps.package.outputs.deb }}"
          DEB_ABS="$GITHUB_WORKSPACE/$DEB"

          rm -rf /tmp/gf-070b4
          mkdir -p /tmp/gf-070b4
          cd /tmp/gf-070b4

          ar -x "$DEB_ABS"
          DATA_TAR="$(find . -maxdepth 1 -type f -name 'data.tar.*' | head -n 1)"
          test -n "$DATA_TAR"
          tar -xf "$DATA_TAR"

          TWEAK="$(find . -type f -name 'GlassFolders.dylib' | head -n 1)"
          PREFS="$(find . -type f -path '*GlassFoldersPrefs.bundle/GlassFoldersPrefs' | head -n 1)"
          FILTER="$(find . -type f -path '*MobileSubstrate/DynamicLibraries/GlassFolders.plist' | head -n 1)"

          test -n "$TWEAK"
          test -n "$PREFS"
          test -n "$FILTER"

          echo "Tweak:"
          file "$TWEAK"

          echo "Preferences:"
          file "$PREFS"

          file "$TWEAK" | grep -qi "arm64e"
          file "$PREFS" | grep -qi "arm64e"

          grep -q "com.apple.springboard" "$FILTER"

          if grep -qi "launchd" "$FILTER"; then
            echo "ERROR: unexpected launchd injection"
            exit 1
          fi

          echo "arm64e + SpringBoard-only verification passed."

      - name: SHA256
        run: |
          shasum -a 256 "${{ steps.package.outputs.deb }}"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassFolders-0.7-Beta4-DEB
          path: ${{ steps.package.outputs.deb }}
          if-no-files-found: error
          retention-days: 14
