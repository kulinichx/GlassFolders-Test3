name: Build RootHide Test4

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build arm64e RootHide deb
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid xz

      - name: Install RootHide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install official Theos patched iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$THEOS/sdks"

          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          SDK_ARCHIVE="/tmp/iPhoneOS16.5.sdk.tar.xz"

          echo "Downloading official Theos patched SDK..."
          curl -L --fail --retry 3 --retry-delay 2 \
            "$SDK_URL" \
            -o "$SDK_ARCHIVE"

          echo "Extracting SDK..."
          tar -xJf "$SDK_ARCHIVE" -C "$THEOS/sdks"

          echo "Installed SDKs:"
          ls -la "$THEOS/sdks"

          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"
          test -d "$SDK"

          echo "Checking Preferences private framework..."
          PREF_FRAMEWORK="$SDK/System/Library/PrivateFrameworks/Preferences.framework"
          test -d "$PREF_FRAMEWORK"

          find "$PREF_FRAMEWORK" -maxdepth 2 -type f -print

          if ! find "$PREF_FRAMEWORK" -type f \( -name '*.tbd' -o -name 'Preferences' \) | grep -q .; then
            echo "ERROR: Preferences framework link stub was not found."
            exit 1
          fi

          echo "Patched iOS 16.5 SDK verification passed."

      - name: Show toolchain information
        run: |
          xcodebuild -version
          clang --version
          git -C "$THEOS" rev-parse HEAD

          echo "Main target:"
          grep '^TARGET' Makefile

          echo "Prefs target:"
          grep '^TARGET' prefs/Makefile

      - name: Build RootHide package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Locate generated deb
        id: package
        shell: bash
        run: |
          set -euo pipefail

          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          if [[ -z "$DEB" ]]; then
            echo "ERROR: No deb produced."
            exit 1
          fi

          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "Generated package:"
          ls -lh "$DEB"

      - name: Extract package
        shell: bash
        run: |
          set -euo pipefail

          DEB="${{ steps.package.outputs.deb }}"
          DEB_ABS="$GITHUB_WORKSPACE/$DEB"

          rm -rf /tmp/gf-test4
          mkdir -p /tmp/gf-test4
          cd /tmp/gf-test4

          ar -x "$DEB_ABS"

          DATA_TAR="$(find . -maxdepth 1 -type f -name 'data.tar.*' | head -n 1)"
          test -n "$DATA_TAR"

          tar -xf "$DATA_TAR"

          echo "Package contents:"
          find . -maxdepth 10 -type f -print

      - name: Verify tweak and preferences are real arm64e
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gf-test4

          TWEAK="$(find . -type f -name 'GlassFolders.dylib' | head -n 1)"
          PREFS="$(find . -type f -path '*GlassFoldersPrefs.bundle/GlassFoldersPrefs' | head -n 1)"

          test -n "$TWEAK"
          test -n "$PREFS"

          echo "Tweak binary:"
          file "$TWEAK"

          echo "Preferences binary:"
          file "$PREFS"

          file "$TWEAK" | grep -qi "arm64e"
          file "$PREFS" | grep -qi "arm64e"

          echo "Both arm64e checks passed."

      - name: Verify SpringBoard-only injection filter
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gf-test4

          FILTER="$(find . -type f -path '*MobileSubstrate/DynamicLibraries/GlassFolders.plist' | head -n 1)"
          test -n "$FILTER"

          echo "Injection filter:"
          cat "$FILTER"

          grep -q "com.apple.springboard" "$FILTER"

          if grep -qi "launchd" "$FILTER"; then
            echo "ERROR: unexpected launchd injection."
            exit 1
          fi

          echo "SpringBoard-only filter verified."

      - name: SHA256
        run: |
          shasum -a 256 "${{ steps.package.outputs.deb }}"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassFolders-Test4-DEB
          path: ${{ steps.package.outputs.deb }}
          if-no-files-found: error
          retention-days: 14
