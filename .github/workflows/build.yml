name: Build RootHide 0.7.3 App Library Beta2.1 Package Gate Fix.3 Runtime Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build arm64e RootHide deb
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid xz

      - name: Install RootHide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install official Theos patched iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$THEOS/sdks"

          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          SDK_ARCHIVE="/tmp/iPhoneOS16.5.sdk.tar.xz"

          curl -L --fail --retry 3 --retry-delay 2 \
            "$SDK_URL" \
            -o "$SDK_ARCHIVE"

          tar -xJf "$SDK_ARCHIVE" -C "$THEOS/sdks"

          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"
          test -d "$SDK"

          PREF_FRAMEWORK="$SDK/System/Library/PrivateFrameworks/Preferences.framework"
          test -d "$PREF_FRAMEWORK"

          if ! find "$PREF_FRAMEWORK" -type f \( -name '*.tbd' -o -name 'Preferences' \) | grep -q .; then
            echo "ERROR: Preferences framework link stub was not found."
            exit 1
          fi


      - name: Source sanity gate
        shell: bash
        run: |
          set -u

          fail=0

          require_text() {
            local needle="$1"
            local file="$2"
            local label="$3"

            if grep -Fq -- "$needle" "$file"; then
              echo "OK: $label"
            else
              echo "ERROR: missing $label"
              fail=1
            fi
          }

          echo "Checking framework imports..."
          require_text '#import <UIKit/UIKit.h>' Tweak.xm 'UIKit import'
          require_text '#import <CoreFoundation/CoreFoundation.h>' Tweak.xm 'CoreFoundation import'
          require_text '#import <QuartzCore/QuartzCore.h>' Tweak.xm 'QuartzCore import'
          require_text '#import <objc/runtime.h>' Tweak.xm 'Objective-C runtime import'
          require_text '#import <dispatch/dispatch.h>' Tweak.xm 'dispatch import'
          require_text '#import <math.h>' Tweak.xm 'math import'
          require_text '#import <dlfcn.h>' Tweak.xm 'dlfcn import'

          echo "Rejecting dangerous controller/factory hooks..."
          if grep -Eq -- 'SBFloatyFolderView|_newPageBackgroundView|setBackgroundAlpha:|SBFolderControllerBackgroundView|SBHLibraryViewController|SBHLibraryPodFolderController|_SBHLibraryPodIconView|_SBHLibraryPodIconListView|GFResolveAppLibraryBackgroundClass|GFInstallAppLibraryRuntimeHook' Tweak.xm; then
            echo "ERROR: forbidden folder/App-Library controller or icon-list path found."
            fail=1
          else
            echo "OK: no forbidden controller/factory hooks"
          fi

          echo "Checking essential runtime entry points..."
          require_text 'SBFolderIconImageView' Tweak.xm 'closed-folder visual class'
          require_text 'SBFolderBackgroundView' Tweak.xm 'opened-folder visual class'
          require_text 'SBHLibraryCategoryPodBackgroundView' Tweak.xm 'App Library category background class'
          require_text '%group GFAppLibraryHooks' Tweak.xm 'App Library Logos group'
          require_text '%init(' Tweak.xm 'Logos initialization'
          require_text 'SpringBoardHome.framework/SpringBoardHome' Tweak.xm 'SpringBoardHome explicit load'
          require_text 'AppLibraryPodsEnabled' Tweak.xm 'App Library preference key'
          require_text 'SBHLibraryPodFolderView' Tweak.xm 'App Library pod container class'
          require_text 'SBHLibraryCategoryPodBackgroundView' Tweak.xm 'App Library category background class'

          if [ "$fail" -ne 0 ]; then
            echo "Source sanity gate failed with the explicit errors above."
            exit 1
          fi

          echo "Source sanity gate passed."

      - name: Build RootHide package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Locate generated deb
        id: package
        shell: bash
        run: |
          set -euo pipefail

          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          test -n "$DEB"

          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          ls -lh "$DEB"

      - name: Extract and verify package
        shell: bash
        run: |
          set -euo pipefail

          DEB="${{ steps.package.outputs.deb }}"
          DEB_ABS="$GITHUB_WORKSPACE/$DEB"

          rm -rf /tmp/gf-072b1
          mkdir -p /tmp/gf-072b1
          cd /tmp/gf-072b1

          ar -x "$DEB_ABS"
          DATA_TAR="$(find . -maxdepth 1 -type f -name 'data.tar.*' | head -n 1)"
          test -n "$DATA_TAR"
          tar -xf "$DATA_TAR"

          TWEAK="$(find . -type f -name 'GlassFolders.dylib' | head -n 1)"
          PREFS="$(find . -type f -path '*GlassFoldersPrefs.bundle/GlassFoldersPrefs' | head -n 1)"
          FILTER="$(find . -type f -path '*MobileSubstrate/DynamicLibraries/GlassFolders.plist' | head -n 1)"

          test -n "$TWEAK"
          test -n "$PREFS"
          test -n "$FILTER"

          echo "Tweak:"
          file "$TWEAK"

          echo "Preferences:"
          file "$PREFS"

          file "$TWEAK" | grep -qi "arm64e"
          file "$PREFS" | grep -qi "arm64e"

          grep -q "com.apple.springboard" "$FILTER"

          if grep -qi "launchd" "$FILTER"; then
            echo "ERROR: unexpected launchd injection"
            exit 1
          fi

          echo "arm64e + SpringBoard-only verification passed."

      - name: SHA256
        run: |
          shasum -a 256 "${{ steps.package.outputs.deb }}"


      - name: Package and binary verification
        shell: bash
        run: |
          set -euo pipefail

          DEB="${{ steps.package.outputs.deb }}"
          TMP="/tmp/gf-beta21-verify"

          rm -rf "$TMP"
          mkdir -p "$TMP/root"

          cd "$TMP"
          ar x "$GITHUB_WORKSPACE/$DEB"

          DATA_TAR="$(find . -maxdepth 1 -type f \( -name 'data.tar.*' -o -name 'data.tar' \) | head -n 1)"
          test -n "$DATA_TAR"
          tar -xf "$DATA_TAR" -C "$TMP/root"

          DYLIB="$(find "$TMP/root" -type f -name 'GlassFolders.dylib' | head -n 1)"
          test -n "$DYLIB"

          STRINGS_FILE="$TMP/GlassFolders.strings"
          strings "$DYLIB" > "$STRINGS_FILE"

          echo "=== Reject dangerous private/controller paths ==="
          if grep -E 'SBFloatyFolderView|_newPageBackgroundView|setBackgroundAlpha:|SBFolderControllerBackgroundView|SBHLibraryViewController|SBHLibraryPodFolderController|_SBHLibraryPodIconView|_SBHLibraryPodIconListView|GFResolveAppLibraryBackgroundClass|GFInstallAppLibraryRuntimeHook' "$STRINGS_FILE"; then
            echo "ERROR: dangerous folder/App-Library path leaked into build."
            exit 1
          fi
          echo "OK: no forbidden controller/factory strings."

          echo "=== Diagnostic: expected visual symbols ==="
          for token in \
            SBFolderIconImageView \
            SBFolderBackgroundView \
            SBHLibraryCategoryPodBackgroundView \
            SBHLibraryPodFolderView \
            _updateVisualStyle
          do
            if grep -Fq "$token" "$STRINGS_FILE"; then
              echo "OK: $token"
            else
              echo "WARN: $token not visible through strings(1)"
            fi
          done

          echo "=== Verify PreferenceLoader entry and icon files in final deb ==="

          PLIST="$(find "$TMP/root" -type f -path '*/Library/PreferenceLoader/Preferences/GlassFolders/GlassFolders.plist' | head -n 1)"
          ICON1="$(find "$TMP/root" -type f -path '*/Library/PreferenceLoader/Preferences/GlassFolders/GlassFoldersIcon.png' | head -n 1)"
          ICON2="$(find "$TMP/root" -type f -path '*/Library/PreferenceLoader/Preferences/GlassFolders/GlassFoldersIcon@2x.png' | head -n 1)"
          ICON3="$(find "$TMP/root" -type f -path '*/Library/PreferenceLoader/Preferences/GlassFolders/GlassFoldersIcon@3x.png' | head -n 1)"

          BUNDLE_ICON1="$(find "$TMP/root" -type f -path '*/Library/PreferenceBundles/GlassFoldersPrefs.bundle/GlassFoldersIcon.png' | head -n 1)"
          BUNDLE_ICON2="$(find "$TMP/root" -type f -path '*/Library/PreferenceBundles/GlassFoldersPrefs.bundle/GlassFoldersIcon@2x.png' | head -n 1)"
          BUNDLE_ICON3="$(find "$TMP/root" -type f -path '*/Library/PreferenceBundles/GlassFoldersPrefs.bundle/GlassFoldersIcon@3x.png' | head -n 1)"

          for required in \
            "$PLIST" \
            "$ICON1" "$ICON2" "$ICON3" \
            "$BUNDLE_ICON1" "$BUNDLE_ICON2" "$BUNDLE_ICON3"
          do
            if [ -z "$required" ]; then
              echo "ERROR: a required PreferenceLoader/icon resource is missing from the final deb."
              echo "Actual packaged PreferenceLoader/PreferenceBundle files:"
              find "$TMP/root" -type f | grep -E 'PreferenceLoader|PreferenceBundles/GlassFoldersPrefs' || true
              exit 1
            fi
          done

          echo "OK: nested PreferenceLoader plist + 1x/2x/3x icons are in the deb."
          echo "OK: 1x/2x/3x icons are also in GlassFoldersPrefs.bundle."

          echo "=== Final packaged preference files ==="
          find "$TMP/root" -type f | grep -E 'PreferenceLoader|PreferenceBundles/GlassFoldersPrefs' | sort

          echo "Package verification passed."

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassFolders-0.7.3-Beta2.1-AppLibraryPod-DEB
          path: ${{ steps.package.outputs.deb }}
          if-no-files-found: error
          retention-days: 14
